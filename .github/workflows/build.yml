name: Build
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust target and components
        run: rustup target add x86_64-pc-windows-msvc && rustup component add rustfmt clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-x86_64-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native module
        working-directory: packages/tapsdk-pc-js
        run: pnpm run build:native

      - name: Build TypeScript
        working-directory: packages/tapsdk-pc-js
        run: pnpm run build:ts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tapsdk-pc-x86_64-pc-windows-msvc
          path: |
            packages/tapsdk-pc-js/dist/
            packages/tapsdk-pc-js/*.node
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    name: macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust target and components
        run: rustup target add ${{ matrix.target }} && rustup component add rustfmt clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-${{ matrix.target }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native module
        working-directory: packages/tapsdk-pc-js
        run: pnpm run build:native -- --target ${{ matrix.target }}

      - name: Build TypeScript
        working-directory: packages/tapsdk-pc-js
        run: pnpm run build:ts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tapsdk-pc-${{ matrix.target }}
          path: |
            packages/tapsdk-pc-js/dist/
            packages/tapsdk-pc-js/*.node
          retention-days: 7
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    name: Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust target and components
        run: rustup target add x86_64-unknown-linux-gnu && rustup component add rustfmt clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-x86_64-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native module
        working-directory: packages/tapsdk-pc-js
        run: pnpm run build:native -- --target x86_64-unknown-linux-gnu

      - name: Build TypeScript
        working-directory: packages/tapsdk-pc-js
        run: pnpm run build:ts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tapsdk-pc-x86_64-unknown-linux-gnu
          path: |
            packages/tapsdk-pc-js/dist/
            packages/tapsdk-pc-js/*.node
          retention-days: 7
          if-no-files-found: warn
